<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Everything this page loads comes from this page's own origin, enforced by the browser rather
     than promised in a README. 'self' rather than 'none' on connect-src because the export reads
     the engine file to inline it; nothing else is ever fetched. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'" />
<title>Dither Field — tune it, then take the code</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ecefe5'/%3E%3Cg fill='%232ad1b2'%3E%3Crect x='2' y='2' width='2' height='2'/%3E%3Crect x='7' y='4' width='2' height='2'/%3E%3Crect x='12' y='3' width='2' height='2'/%3E%3Crect x='4' y='9' width='2' height='2'/%3E%3Crect x='10' y='11' width='2' height='2'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="stylesheet" href="tuner/tuner.css" />
</head>
<body>
<!-- The panel comes first, so keyboard order matches the layout: controls on the left. -->
<!-- The aside is the rounded sheet; #panel scrolls inside it, so the scrollbar never squares off its corners. -->
<aside class="sheet">
	<div id="panel"></div>
	<div id="panel-handle" role="separator" aria-orientation="vertical" aria-label="Panel width" aria-valuemin="300" tabindex="0" title="Drag to widen the panel; double-click for the standard width"></div>
</aside>

<div id="stage">
	<div id="frame" class="fill underlay">
		<div id="host"></div>
	</div>
	<div id="stats"></div>
</div>
<button id="reopen" type="button" title="Show the controls" hidden>Controls</button>

<dialog id="export-dialog" aria-labelledby="export-title">
	<div class="dialog-head">
		<h2 id="export-title">Get the code</h2>
		<button id="close-dialog" type="button" class="ghost">Close</button>
	</div>
	<div class="dialog-body">
		<div class="modes" id="export-modes" role="radiogroup" aria-label="How to load the engine"></div>
		<p class="note" id="export-note"></p>
		<textarea id="export-box" readonly wrap="off" spellcheck="false" aria-label="The code for your settings"></textarea>
	</div>
	<div class="dialog-foot">
		<span class="foot-label" id="dl-label">Download</span>
		<div class="downloads" role="group" aria-labelledby="dl-label">
			<button id="dl-demo" type="button" class="ghost" title="A complete page with your settings, to open or send">Demo page</button>
			<button id="dl-engine" type="button" class="ghost" title="dither-field.js, to host next to your page">Engine</button>
			<button id="dl-settings" type="button" class="ghost" title="Your settings as JSON, to load back in later">Settings</button>
		</div>
		<span class="spacer"></span>
		<button id="copy-btn" type="button" class="primary">Copy code</button>
	</div>
</dialog>

<dialog id="reset-dialog" aria-labelledby="reset-title">
	<div class="dialog-body">
		<h2 id="reset-title">Reset to defaults?</h2>
		<p class="note">This clears your tuning from this browser. It can't be undone.</p>
	</div>
	<div class="dialog-foot">
		<span class="spacer"></span>
		<button id="reset-cancel" type="button" autofocus>Cancel</button>
		<button id="reset-confirm" type="button" class="primary">Reset to defaults</button>
	</div>
</dialog>

<script type="module" src="tuner/tuner.js"></script>
</body>
</html>
